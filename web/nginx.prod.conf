# The production profile (spec 019): the same app and proxies as nginx.conf, over HTTPS only.
server {
  listen 443 ssl;
  http2 on;

  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  location /order-api/hubs/ {
    proxy_pass http://order:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /order-api/ {
    proxy_pass http://order:8080/;
  }

  location /notification-api/ {
    proxy_pass http://notification:8080/;
  }

  location /inventory-api/ {
    proxy_pass http://inventory:8080/;
  }

  location / {
    try_files $uri /index.html;
  }
}
