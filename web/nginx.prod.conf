# The production profile (spec 019): the same app and proxies as nginx.conf, over HTTPS only.
server {
  listen 443 ssl;
  http2 on;

  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # Spec 023: the gateway logs in, keeps the tokens, and forwards the page's calls with the token added.
  location /bff/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  # Live order updates (spec 005): SignalR upgrades to a WebSocket.
  location ^~ /order-api/hubs/ { # ^~: before the regex below, which would lose the upgrade
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location ~ ^/(order-api|notification-api|inventory-api)/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
