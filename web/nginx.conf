server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Same prefixes as the Vite dev proxy (vite.config.ts).

  # Live order updates (spec 005): SignalR upgrades to a WebSocket.
  location /order-api/hubs/ {
    proxy_pass http://order:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /order-api/ {
    proxy_pass http://order:8080/;
  }

  location /notification-api/ {
    proxy_pass http://notification:8080/;
  }

  location / {
    try_files $uri /index.html;
  }
}
