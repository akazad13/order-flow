openapi: 3.1.0
info:
  title: OrderFlow Notification API (fake inbox)
  version: 1.0.0
  description: Read side of the fake customer inbox. Lets the UI and tests see what the customer was told. Needs a login; a customer reads only their own inbox (spec 012).
  contact:
    name: OrderFlow
    url: https://example.com/orderflow
servers:
  - url: http://localhost:5104
    description: Local (dotnet run)
security:
  - bearer: []
tags:
  - name: inbox
    description: Messages sent to customers.
paths:
  /inbox/{customerId}:
    get:
      operationId: getInbox
      tags: [inbox]
      summary: List a customer's messages
      description: Ordered by `occurredAt` (when the event happened), oldest first, regardless of the order messages arrived. Empty array when the customer has no messages.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The customer's messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxMessage'
        '401':
          description: No valid login (spec 012).
        '403':
          description: The inbox belongs to another customer.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from Keycloak, realm `orderflow` (ADR 0008).
  schemas:
    InboxMessage:
      type: object
      required: [messageId, customerId, orderId, text, occurredAt, receivedAt]
      properties:
        messageId:
          type: string
          format: uuid
        customerId:
          type: string
        orderId:
          type: string
          format: uuid
        text:
          type: string
          examples: [We received your order]
        occurredAt:
          type: string
          format: date-time
          description: When the event behind the message happened (e.g. the order was placed).
        receivedAt:
          type: string
          format: date-time
          description: When the Notification service received the event.
