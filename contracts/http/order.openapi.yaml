openapi: 3.1.0
info:
  title: OrderFlow Order API
  version: 0.2.0
  description: Customer-facing API for placing and reading orders. Specs 000 and 001.
  contact:
    name: OrderFlow
    url: https://example.com/orderflow
servers:
  - url: http://localhost:5101
    description: Local (dotnet run)
tags:
  - name: orders
    description: Place and read orders.
paths:
  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place an order
      description: Accepts a valid order as Pending and publishes OrderPlaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted.
          headers:
            Location:
              description: URL of the new order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The order is invalid; errors are keyed by field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      description: Returns the current state of one order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order with that ID.
components:
  schemas:
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          examples: [SKU-001]
        quantity:
          type: integer
          minimum: 1
          examples: [2]
    PlaceOrderRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId:
          type: string
          minLength: 1
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderStatus:
      type: string
      enum: [Pending, Confirmed]
      description: Only moves forward. Grows with later specs (Cancelled).
    Order:
      type: object
      required: [orderId, customerId, status, lines, total, placedAt]
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: [number, 'null']
          minimum: 0
          description: Sum of quantity times unit price. Null until stock is held and the order is priced.
          examples: [37.0]
        placedAt:
          type: string
          format: date-time
    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
