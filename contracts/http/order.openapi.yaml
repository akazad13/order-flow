openapi: 3.1.0
info:
  title: OrderFlow Order API
  version: 0.5.0
  description: |
    Customer-facing API for placing, reading and cancelling orders. Specs 000 to 003, 006 and 012.
    Status changes are pushed by the hub in contracts/realtime (spec 005).
    Every operation needs a login (spec 012): an access token from the `orderflow` Keycloak realm,
    audience `orderflow-api`. The customer is the token's subject; another customer's order
    answers 404, exactly like an order that does not exist.
  contact:
    name: OrderFlow
    url: https://example.com/orderflow
servers:
  - url: http://localhost:5101
    description: Local (dotnet run)
security:
  - bearer: []
tags:
  - name: orders
    description: Place and read orders.
paths:
  /orders:
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place an order
      description: Accepts a valid order as Pending and publishes OrderPlaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted.
          headers:
            Location:
              description: URL of the new order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: No valid login (spec 012).
        '400':
          description: The order is invalid; errors are keyed by field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      description: Returns the current state of one order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: No valid login (spec 012).
        '404':
          description: No order with that ID for the logged-in customer.
  /orders/{orderId}/cancellation:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Ask to cancel an order
      description: |
        Spec 006. A Pending order: the request is recorded and the order service decides
        (202); the outcome is pushed to watchers (spec 005). If the order is confirmed before
        the request is handled, it stays Confirmed. Repeating the request is harmless.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Request accepted; the order as it is now (still Pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: The order was already cancelled; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: No valid login (spec 012).
        '404':
          description: No order with that ID for the logged-in customer.
        '409':
          description: The order is already confirmed and cannot be cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from Keycloak, realm `orderflow` (ADR 0008).
  schemas:
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          examples: [SKU-001]
        quantity:
          type: integer
          minimum: 1
          examples: [2]
    PlaceOrderRequest:
      type: object
      required: [lines]
      description: The customer is the logged-in one (spec 012, R-1); the request cannot name another.
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderStatus:
      type: string
      enum: [Pending, Confirmed, Cancelled]
      description: Only moves forward. Confirmed and Cancelled are final.
    Order:
      type: object
      required: [orderId, customerId, status, lines, total, cancellation, placedAt]
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: [number, 'null']
          minimum: 0
          description: Sum of quantity times unit price. Null until stock is held and the order is priced.
          examples: [37.0]
        cancellation:
          oneOf:
            - $ref: '#/components/schemas/Cancellation'
            - type: 'null'
          description: Why the order was cancelled. Null unless status is Cancelled.
        placedAt:
          type: string
          format: date-time
    Cancellation:
      type: object
      required: [reason, detail]
      properties:
        reason:
          type: string
          enum: [OutOfStock, PaymentDeclined, CustomerRequested]
        detail:
          type: string
          examples: [Only 1 of SKU-002 available, 2 requested.]
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
          examples: [The order is already confirmed.]
        status:
          type: integer
        detail:
          type: string
    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
