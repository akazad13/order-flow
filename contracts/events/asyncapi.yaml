asyncapi: 3.1.0
info:
  title: OrderFlow events
  version: 3.0.0
  description: |
    Events exchanged between OrderFlow services over RabbitMQ (MassTransit v8).
    MassTransit wraps each payload in an envelope; the schemas below describe the
    envelope's `message` field. Message types use URNs such as `orderflow:order-placed:v1`.
    Each event has a fanout exchange named after it; each consuming service binds its own queue.
    Amounts are decimal strings in the shop currency ("62.00"): MassTransit serializes
    `decimal` as a string so no consumer loses precision to floating point.
defaultContentType: application/json
servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ from docker-compose.yml
channels:
  orderPlaced:
    address: order-placed
    description: An order was accepted and is Pending.
    messages:
      OrderPlaced:
        $ref: '#/components/messages/OrderPlaced'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  stockReserved:
    address: stock-reserved
    description: Stock for every line of an order is held, and the order is priced.
    messages:
      StockReserved:
        $ref: '#/components/messages/StockReserved'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  paymentSucceeded:
    address: payment-succeeded
    description: The customer was charged the order total.
    messages:
      PaymentSucceeded:
        $ref: '#/components/messages/PaymentSucceeded'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  orderConfirmed:
    address: order-confirmed
    description: Stock is held and payment succeeded; the order is Confirmed.
    messages:
      OrderConfirmed:
        $ref: '#/components/messages/OrderConfirmed'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  stockRejected:
    address: stock-rejected
    description: Nothing was held for the order; every short line is listed.
    messages:
      StockRejected:
        $ref: '#/components/messages/StockRejected'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  paymentFailed:
    address: payment-failed
    description: The payment was declined; no charge was made.
    messages:
      PaymentFailed:
        $ref: '#/components/messages/PaymentFailed'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  orderCancelledV2:
    address: order-cancelled-v2
    description: The order is Cancelled (final), with a reason. v2 (spec 016) adds the reason StaffRequested; v1 was retired in spec 018.
    messages:
      OrderCancelledV2:
        $ref: '#/components/messages/OrderCancelledV2'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  orderCancellationRequested:
    address: order-cancellation-requested
    description: The customer asked to cancel a Pending order (spec 006). Only the Order service listens.
    messages:
      OrderCancellationRequested:
        $ref: '#/components/messages/OrderCancellationRequested'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  paymentRefunded:
    address: payment-refunded
    description: A charge for a cancelled order was refunded (spec 006).
    messages:
      PaymentRefunded:
        $ref: '#/components/messages/PaymentRefunded'
    bindings:
      $ref: '#/components/channelBindings/fanout'
  stockReleased:
    address: stock-released
    description: Stock held for a cancelled order is available again.
    messages:
      StockReleased:
        $ref: '#/components/messages/StockReleased'
    bindings:
      $ref: '#/components/channelBindings/fanout'
operations:
  publishOrderPlaced:
    action: send
    summary: Order service announces an accepted order.
    channel:
      $ref: '#/channels/orderPlaced'
    messages:
      - $ref: '#/channels/orderPlaced/messages/OrderPlaced'
  inventoryReceivesOrderPlaced:
    action: receive
    summary: Inventory holds stock for the order, all or nothing.
    channel:
      $ref: '#/channels/orderPlaced'
    messages:
      - $ref: '#/channels/orderPlaced/messages/OrderPlaced'
  orderReceivesOrderPlaced:
    action: receive
    summary: The Order state machine starts tracking the order.
    channel:
      $ref: '#/channels/orderPlaced'
    messages:
      - $ref: '#/channels/orderPlaced/messages/OrderPlaced'
  notificationReceivesOrderPlaced:
    action: receive
    summary: Notification tells the customer the order was received.
    channel:
      $ref: '#/channels/orderPlaced'
    messages:
      - $ref: '#/channels/orderPlaced/messages/OrderPlaced'
  publishStockReserved:
    action: send
    summary: Inventory announces that stock is held and the order is priced.
    channel:
      $ref: '#/channels/stockReserved'
    messages:
      - $ref: '#/channels/stockReserved/messages/StockReserved'
  paymentReceivesStockReserved:
    action: receive
    summary: Payment charges the order total.
    channel:
      $ref: '#/channels/stockReserved'
    messages:
      - $ref: '#/channels/stockReserved/messages/StockReserved'
  orderReceivesStockReserved:
    action: receive
    summary: The Order state machine records the total and waits for payment.
    channel:
      $ref: '#/channels/stockReserved'
    messages:
      - $ref: '#/channels/stockReserved/messages/StockReserved'
  publishPaymentSucceeded:
    action: send
    summary: Payment announces a successful charge.
    channel:
      $ref: '#/channels/paymentSucceeded'
    messages:
      - $ref: '#/channels/paymentSucceeded/messages/PaymentSucceeded'
  orderReceivesPaymentSucceeded:
    action: receive
    summary: The Order state machine confirms the order.
    channel:
      $ref: '#/channels/paymentSucceeded'
    messages:
      - $ref: '#/channels/paymentSucceeded/messages/PaymentSucceeded'
  publishOrderConfirmed:
    action: send
    summary: Order service announces a confirmed order.
    channel:
      $ref: '#/channels/orderConfirmed'
    messages:
      - $ref: '#/channels/orderConfirmed/messages/OrderConfirmed'
  notificationReceivesOrderConfirmed:
    action: receive
    summary: Notification tells the customer the order is confirmed.
    channel:
      $ref: '#/channels/orderConfirmed'
    messages:
      - $ref: '#/channels/orderConfirmed/messages/OrderConfirmed'
  publishStockRejected:
    action: send
    summary: Inventory announces a shortage (spec 002).
    channel:
      $ref: '#/channels/stockRejected'
    messages:
      - $ref: '#/channels/stockRejected/messages/StockRejected'
  orderReceivesStockRejected:
    action: receive
    summary: The Order state machine cancels the order (OutOfStock).
    channel:
      $ref: '#/channels/stockRejected'
    messages:
      - $ref: '#/channels/stockRejected/messages/StockRejected'
  publishPaymentFailed:
    action: send
    summary: Payment announces a declined payment (spec 003).
    channel:
      $ref: '#/channels/paymentFailed'
    messages:
      - $ref: '#/channels/paymentFailed/messages/PaymentFailed'
  orderReceivesPaymentFailed:
    action: receive
    summary: The Order state machine cancels the order (PaymentDeclined).
    channel:
      $ref: '#/channels/paymentFailed'
    messages:
      - $ref: '#/channels/paymentFailed/messages/PaymentFailed'
  publishOrderCancelledV2:
    action: send
    summary: Order service announces a cancelled order (v2 since spec 016; v1 retired in spec 018).
    channel:
      $ref: '#/channels/orderCancelledV2'
    messages:
      - $ref: '#/channels/orderCancelledV2/messages/OrderCancelledV2'
  inventoryReceivesOrderCancelledV2:
    action: receive
    summary: Inventory releases whatever the order held, as for v1 (spec 016).
    channel:
      $ref: '#/channels/orderCancelledV2'
    messages:
      - $ref: '#/channels/orderCancelledV2/messages/OrderCancelledV2'
  notificationReceivesOrderCancelledV2:
    action: receive
    summary: Notification tells the customer why, in the words for each reason, as for v1 (spec 016).
    channel:
      $ref: '#/channels/orderCancelledV2'
    messages:
      - $ref: '#/channels/orderCancelledV2/messages/OrderCancelledV2'
  paymentReceivesOrderCancelledV2:
    action: receive
    summary: Payment refunds or voids, as for v1 (spec 016).
    channel:
      $ref: '#/channels/orderCancelledV2'
    messages:
      - $ref: '#/channels/orderCancelledV2/messages/OrderCancelledV2'
  orderReceivesOrderCancelledV2:
    action: receive
    summary: The Order service pushes the final order to its watchers (spec 005; documented since spec 016).
    channel:
      $ref: '#/channels/orderCancelledV2'
    messages:
      - $ref: '#/channels/orderCancelledV2/messages/OrderCancelledV2'
  publishOrderCancellationRequested:
    action: send
    summary: The Order API records a customer's request to cancel, or staff's on their behalf (spec 015).
    channel:
      $ref: '#/channels/orderCancellationRequested'
    messages:
      - $ref: '#/channels/orderCancellationRequested/messages/OrderCancellationRequested'
  orderReceivesOrderCancellationRequested:
    action: receive
    summary: The state machine cancels a Pending order, or ignores the request if the order is already final.
    channel:
      $ref: '#/channels/orderCancellationRequested'
    messages:
      - $ref: '#/channels/orderCancellationRequested/messages/OrderCancellationRequested'
  publishPaymentRefunded:
    action: send
    summary: Payment announces a refund, at most once per order.
    channel:
      $ref: '#/channels/paymentRefunded'
    messages:
      - $ref: '#/channels/paymentRefunded/messages/PaymentRefunded'
  notificationReceivesPaymentRefunded:
    action: receive
    summary: Notification tells the customer their payment was refunded.
    channel:
      $ref: '#/channels/paymentRefunded'
    messages:
      - $ref: '#/channels/paymentRefunded/messages/PaymentRefunded'
  publishStockReleased:
    action: send
    summary: Inventory announces released stock, at most once per order.
    channel:
      $ref: '#/channels/stockReleased'
    messages:
      - $ref: '#/channels/stockReleased/messages/StockReleased'
components:
  channelBindings:
    fanout:
      amqp:
        is: routingKey
        exchange:
          type: fanout
          durable: true
          autoDelete: false
  messages:
    OrderPlaced:
      name: OrderPlaced
      title: Order placed (v1)
      summary: A customer's order was accepted and is Pending.
      payload:
        $ref: './schemas/order-placed.v1.json'
    StockReserved:
      name: StockReserved
      title: Stock reserved (v1)
      summary: Every line of the order is held; lines carry their unit price and the order its total.
      payload:
        $ref: './schemas/stock-reserved.v1.json'
    PaymentSucceeded:
      name: PaymentSucceeded
      title: Payment succeeded (v1)
      summary: The customer was charged the order total.
      payload:
        $ref: './schemas/payment-succeeded.v1.json'
    OrderConfirmed:
      name: OrderConfirmed
      title: Order confirmed (v1)
      summary: The order is Confirmed.
      payload:
        $ref: './schemas/order-confirmed.v1.json'
    StockRejected:
      name: StockRejected
      title: Stock rejected (v1)
      summary: Nothing was held for the order; every short line is listed.
      payload:
        $ref: './schemas/stock-rejected.v1.json'
    PaymentFailed:
      name: PaymentFailed
      title: Payment failed (v1)
      summary: The payment was declined; no charge was made.
      payload:
        $ref: './schemas/payment-failed.v1.json'
    OrderCancellationRequested:
      name: OrderCancellationRequested
      title: Order cancellation requested (v1)
      summary: The customer asked to cancel a Pending order.
      payload:
        $ref: './schemas/order-cancellation-requested.v1.json'
    PaymentRefunded:
      name: PaymentRefunded
      title: Payment refunded (v1)
      summary: A charge for a cancelled order was refunded in full.
      payload:
        $ref: './schemas/payment-refunded.v1.json'
    OrderCancelledV2:
      name: OrderCancelledV2
      title: Order cancelled (v2)
      summary: The order is Cancelled (final), with a reason, which may be StaffRequested (spec 016).
      payload:
        $ref: './schemas/order-cancelled.v2.json'
    StockReleased:
      name: StockReleased
      title: Stock released (v1)
      summary: Stock held for a cancelled order is available again.
      payload:
        $ref: './schemas/stock-released.v1.json'
