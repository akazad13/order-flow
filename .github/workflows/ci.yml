name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lint contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:contracts

  dotnet:
    name: .NET unit, component and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test OrderFlow.slnx --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: test-results

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Fails if the generated API types are stale versus contracts/http.
      - run: npm run gen:api && git diff --exit-code -- src/api
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose + Playwright)
    needs: [contracts, dotnet, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wait
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - run: docker compose logs
        if: failure()
        working-directory: .
      - run: docker compose down -v
        if: always()
        working-directory: .
