name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lint contracts, check specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:contracts
      # Spec 009: specs, plans, features and tests agree; no banned packages (AC-1 to AC-5).
      - run: npm run check:specs
      # The gates' own tests (AC-8).
      - run: npm run test:scripts

  dotnet:
    name: .NET unit, component, contract and Pact provider tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test OrderFlow.slnx --filter "Category!=Integration" --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: test-results

  integration:
    name: Integration tests (Testcontainers) and migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      # Fails if an EF model changed without a migration (ADR 0005).
      - run: dotnet ef migrations has-pending-model-changes -p src/OrderFlow.Order -s src/OrderFlow.Order
      - run: dotnet ef migrations has-pending-model-changes -p src/OrderFlow.Inventory -s src/OrderFlow.Inventory
      - run: dotnet ef migrations has-pending-model-changes -p src/OrderFlow.Payment -s src/OrderFlow.Payment
      - run: dotnet test OrderFlow.slnx --filter "Category=Integration" --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Fails if the generated API types are stale versus contracts/http.
      - run: npm run gen:api && git diff --exit-code -- src/api
      # Includes the Pact consumer tests, which rewrite pacts/ (spec 008).
      - run: npm test
      # Fails if the committed contract is out of date with the web tests (ADR 0006).
      - run: git diff --exit-code -- ../pacts
      - run: npm run build

  e2e:
    name: End-to-end (docker compose + Playwright)
    needs: [contracts, dotnet, integration, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wait
      - run: npm test
      # Spec 009, AC-6: no message may have faulted quietly, even if every scenario passed.
      # rabbitmqctl gives live counts; the management API's lag by about 5 seconds.
      - name: No faulted or skipped messages
        if: ${{ !cancelled() }}
        run: docker compose exec -T rabbitmq rabbitmqctl list_queues name messages --formatter json | node scripts/check-error-queues.mjs -
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - run: docker compose logs
        if: failure()
        working-directory: .
      - run: docker compose down -v
        if: always()
        working-directory: .
