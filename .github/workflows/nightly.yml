name: Nightly stability

# Spec 009, AC-7: flakiness is found on a schedule, not in someone's pull request.
# CI never retries (constitution V); a red night is a bug to fix the next day.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e-repeated:
    name: E2E x10 (docker compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Spec 013: two copies of every service; every docker compose command below uses both files.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.copies.yml
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wait:copies
      - run: npx bddgen && npx playwright test --repeat-each=10
      - name: No faulted or skipped messages
        if: ${{ !cancelled() }}
        run: docker compose exec -T rabbitmq rabbitmqctl list_queues name messages --formatter json | node e2e/scripts/check-error-queues.mjs -
        working-directory: .
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nightly-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - run: docker compose logs
        if: failure()
        working-directory: .
      - run: docker compose down -v
        if: always()
        working-directory: .

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test OrderFlow.slnx --filter "Category=Integration" --logger "trx" --results-directory test-results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nightly-integration-results
          path: test-results
