x-service: &service
  build: &service-build
    context: .
    dockerfile: build/service.Dockerfile
  environment:
    RabbitMq__Host: rabbitmq
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orderflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Customer logins (spec 012, ADR 0008). Dev mode, admin/admin: local and CI only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180 # the issuer browsers see
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # services reach it as http://keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/dev:/opt/keycloak/data/import:ro # generated: production realm + dev overlay (spec 019)
    ports:
      - "8180:8080"
    healthcheck:
      # The image has no curl: ask the management port's readiness check over bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  order:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Order }
    environment:
      RabbitMq__Host: rabbitmq
      Persistence__Provider: Postgres # ADR 0005
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orderflow;Password=orderflow
      # Spec 012, ADR 0008: keys from Keycloak inside compose; tokens name the browser's address as issuer.
      Auth__Authority: http://localhost:8180/realms/orderflow
      Auth__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["5101:8080"]

  inventory:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Inventory }
    environment:
      RabbitMq__Host: rabbitmq
      Persistence__Provider: Postgres # ADR 0005
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=orderflow;Password=orderflow
      # Spec 017: admins set stock. Same login settings as Order and Notification (spec 012, ADR 0008).
      Auth__Authority: http://localhost:8180/realms/orderflow
      Auth__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["5102:8080"]

  payment:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Payment }
    environment:
      RabbitMq__Host: rabbitmq
      Payment__EnableTestEndpoints: "true" # PUT /test/declines/{customerId} (spec 003, Q1), PUT /test/stalls/{customerId} (spec 006, Q4)
      Persistence__Provider: Postgres # ADR 0005, spec 010
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=orderflow;Password=orderflow
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["5103:8080"]

  notification:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Notification }
    environment:
      RabbitMq__Host: rabbitmq
      Persistence__Provider: Postgres # ADR 0005, spec 011
      ConnectionStrings__Notifications: Host=postgres;Database=notifications;Username=orderflow;Password=orderflow
      # Spec 012, ADR 0008: keys from Keycloak inside compose; tokens name the browser's address as issuer.
      Auth__Authority: http://localhost:8180/realms/orderflow
      Auth__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["5104:8080"]

  web:
    build: ./web
    ports: ["5180:80"]
    depends_on: [order, notification]

volumes:
  postgres-data:
