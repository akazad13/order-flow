x-service: &service
  build: &service-build
    context: .
    dockerfile: build/service.Dockerfile
  environment:
    RabbitMq__Host: rabbitmq
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orderflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  order:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Order }
    environment:
      RabbitMq__Host: rabbitmq
      Persistence__Provider: Postgres # ADR 0005
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orderflow;Password=orderflow
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["5101:8080"]

  inventory:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Inventory }
    environment:
      RabbitMq__Host: rabbitmq
      Inventory__EnableTestEndpoints: "true" # PUT /stock/{sku} for tests and demos (spec 001, Q4)
      Persistence__Provider: Postgres # ADR 0005
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=orderflow;Password=orderflow
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["5102:8080"]

  payment:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Payment }
    environment:
      RabbitMq__Host: rabbitmq
      Payment__EnableTestEndpoints: "true" # PUT /test/declines/{customerId} (spec 003, Q1), PUT /test/stalls/{customerId} (spec 006, Q4)
    ports: ["5103:8080"]

  notification:
    <<: *service
    build:
      <<: *service-build
      args: { PROJECT: OrderFlow.Notification }
    ports: ["5104:8080"]

  web:
    build: ./web
    ports: ["5180:80"]
    depends_on: [order, notification]

volumes:
  postgres-data:
