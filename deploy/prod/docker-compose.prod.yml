# The production profile (spec 019), run locally: Keycloak's optimized production build on its own
# PostgreSQL, HTTPS only, secrets from deploy/prod/.env, the production realm (no demo users, no
# test client), and services that fetch Keycloak's keys over HTTPS only. Paths are relative to
# the repository root (the first compose file's folder).
#
#   bash deploy/prod/make-certs.sh && node deploy/prod/make-env.mjs
#   docker compose -p orderflow-prod -f docker-compose.yml -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env up -d --build --wait
#
# Only the shop (5443) and Keycloak (8443) are published (spec 021): the services, PostgreSQL and
# RabbitMQ are reachable from inside the profile's network only. Stop the development stack first.

x-trust-keycloak: &trust-keycloak
  # Keycloak over HTTPS, inside compose; tokens name the browser's address as issuer (ADR 0008).
  Auth__Authority: https://localhost:8443/realms/orderflow
  Auth__MetadataAddress: https://keycloak:8443/realms/orderflow/.well-known/openid-configuration
  Auth__RequireHttpsMetadata: "true"
  # The local CA from make-certs.sh. With a publicly trusted certificate this line goes.
  SSL_CERT_FILE: /certs/ca.crt

# Spec 021, AC-4: no published port to poll, so docker compose asks the service itself. The image
# has no curl; bash's /dev/tcp sends a plain HTTP request to /health. Explicitly bash: CMD-SHELL
# would run /bin/sh (dash), which has no /dev/tcp.
x-healthy: &healthy
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 5s
    retries: 40

services:
  # Spec 021 (R-1): reachable from inside the profile's network only.
  postgres:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run node deploy/prod/make-env.mjs}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: orderflow/keycloak-prod
    build:
      context: deploy/keycloak
    command: !override ["start", "--optimized", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?run node deploy/prod/make-env.mjs}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run node deploy/prod/make-env.mjs}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run node deploy/prod/make-env.mjs}
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # services reach it as https://keycloak:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_HTTP_MANAGEMENT_SCHEME: http # the health checks only, on the management port, not published
      # Resolved by Keycloak when it imports the production realm (spec 019, Q2).
      ORDERFLOW_WEB_URL: https://localhost:5443
    volumes: !override
      - ./deploy/keycloak/orderflow-realm.json:/opt/keycloak/data/import/orderflow-realm.json:ro
      - ./deploy/prod/certs:/certs:ro
    ports: !override ["8443:8443"]
    depends_on:
      keycloak-db: { condition: service_healthy }

  order:
    <<: *healthy
    environment:
      <<: *trust-keycloak
    volumes:
      - ./deploy/prod/certs/ca.crt:/certs/ca.crt:ro
    ports: !reset []

  inventory:
    <<: *healthy
    environment:
      <<: *trust-keycloak
    volumes:
      - ./deploy/prod/certs/ca.crt:/certs/ca.crt:ro
    ports: !reset []

  notification:
    <<: *healthy
    environment:
      <<: *trust-keycloak
    volumes:
      - ./deploy/prod/certs/ca.crt:/certs/ca.crt:ro
    ports: !reset []

  payment:
    <<: *healthy
    environment:
      Payment__EnableTestEndpoints: "false" # no test switches in production (AC-6)
    ports: !reset []

  web:
    build:
      args:
        VITE_AUTH_AUTHORITY: https://localhost:8443/realms/orderflow
    volumes:
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/prod/certs:/certs:ro
    ports: !override ["5443:443"]

volumes:
  keycloak-db-data:
